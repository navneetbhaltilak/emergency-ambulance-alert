<!doctype html>
<html>
  <head>
    <title>Ambulance Alert</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#101820" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://emergency-ambulance-alert.onrender.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <style>
      :root {
        --ink: #101820;
        --paper: #edefea;
        --line: #c9cdc3;
        --green: #1e7a4d;
        --amber: #d98e04;
        --amber-bg: #fbefd2;
        --orange: #c1501c;
        --orange-bg: #f6d9c4;
        --red: #b3211b;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
      }

      html,
      body {
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        font-family:
          "IBM Plex Sans",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: var(--paper);
        color: var(--ink);
        transition:
          background-color 0.5s ease,
          color 0.5s ease;
        --sweep-dur: 6s;
        --ripple-dur: 4s;
      }
      body[data-level="info"] {
        background: var(--amber-bg);
        color: var(--ink);
        --sweep-dur: 4s;
        --ripple-dur: 2.6s;
      }
      body[data-level="high"] {
        background: var(--orange-bg);
        color: var(--ink);
        --sweep-dur: 2.2s;
        --ripple-dur: 1.6s;
      }
      body[data-level="critical"] {
        background: var(--red);
        color: #fff;
        --sweep-dur: 1.2s;
        --ripple-dur: 0.9s;
      }

      .app {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 18px 20px 32px;
        position: relative;
      }
      .topbar {
        width: 100%;
        max-width: 340px;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        position: relative;
      }
      .brand {
        grid-column: 2;
        justify-self: center;
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .brand-mark {
        font-size: 20px;
      }
      h1 {
        font-size: 16px;
        font-weight: 600;
        margin: 0;
      }
      .icon-btn {
        background: none;
        border: none;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        color: currentColor;
        opacity: 0.75;
        padding: 8px;
        border-radius: 8px;
      }
      .icon-btn:active {
        opacity: 0.4;
      }
      #menuBtn {
        grid-column: 1;
        justify-self: start;
      }
      #muteBtn {
        grid-column: 3;
        justify-self: end;
      }

      /* Dropdown Menu Drawer */
      .menu-sheet {
        display: none;
        position: absolute;
        top: 52px;
        left: 20px;
        z-index: 100;
        background: #16213e;
        color: #fff;
        border-radius: 14px;
        padding: 8px;
        width: 230px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      }
      .menu-sheet.open {
        display: block;
      }
      .menu-item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 11px 12px;
        border: none;
        background: none;
        color: #fff;
        font-size: 13.5px;
        font-weight: 500;
        text-align: left;
        border-radius: 9px;
        cursor: pointer;
        text-decoration: none;
      }
      .menu-item:hover,
      .menu-item:active {
        background: rgba(255, 255, 255, 0.1);
      }
      .menu-divider {
        height: 1px;
        background: rgba(255, 255, 255, 0.12);
        margin: 4px 0;
      }

      /* Radar is ALWAYS visible so the app feels alive immediately */
      .radar-stage {
        width: min(82vw, 300px);
        margin-top: 12px;
        position: relative;
      }
      .radar-stage svg {
        width: 100%;
        height: auto;
        display: block;
        overflow: visible;
      }

      .zone-ring {
        fill: none;
        stroke: currentColor;
        opacity: 0.16;
      }
      #sweepWedge {
        fill: currentColor;
        opacity: 0.14;
      }
      #sweepGroup {
        transform-origin: 150px 150px;
        animation: spin var(--sweep-dur) linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .ripple {
        fill: none;
        stroke: currentColor;
        opacity: 0.5;
        animation: rip var(--ripple-dur) ease-out infinite;
      }
      .ripple.r2 {
        animation-delay: calc(var(--ripple-dur) / -3);
      }
      .ripple.r3 {
        animation-delay: calc(var(--ripple-dur) / -3 * 2);
      }
      @keyframes rip {
        from {
          r: 6;
          opacity: 0.55;
        }
        to {
          r: 140;
          opacity: 0;
        }
      }

      .tap-ripple {
        fill: none;
        stroke: currentColor;
        animation: tapRip 0.8s ease-out forwards;
      }
      @keyframes tapRip {
        from {
          r: 6;
          opacity: 0.6;
        }
        to {
          r: 130;
          opacity: 0;
        }
      }

      .you-dot {
        fill: currentColor;
        cursor: pointer;
      }
      .you-dot:active {
        opacity: 0.7;
      }

      .amb-marker {
        fill: var(--red);
        transition:
          cx 0.6s ease,
          cy 0.6s ease;
      }
      body[data-level="critical"] .amb-marker {
        fill: #fff;
        animation: ambPulse 0.9s ease-in-out infinite;
      }
      @keyframes ambPulse {
        0%,
        100% {
          r: 7;
        }
        50% {
          r: 11;
        }
      }
      .trail-dot {
        fill: var(--red);
      }
      body[data-level="critical"] .trail-dot {
        fill: #fff;
      }

      .radar-n {
        font-size: 10px;
        fill: currentColor;
        opacity: 0.5;
      }

      .readout {
        width: 100%;
        max-width: 320px;
        text-align: center;
        margin-top: 6px;
      }
      .level-tag {
        font-size: 18px;
        font-weight: 700;
        margin-top: 2px;
      }
      .distance-row {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 6px;
        margin-top: 4px;
      }
      .distance-num {
        font-size: 44px;
        font-weight: 700;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      .distance-unit {
        font-size: 13px;
        opacity: 0.7;
      }
      .level-desc {
        font-size: 13.5px;
        opacity: 0.78;
        margin-top: 6px;
        line-height: 1.45;
      }
      .dest-note {
        font-size: 12.5px;
        font-weight: 500;
        opacity: 0.8;
        margin-top: 8px;
        min-height: 16px;
      }

      /* One-tap action card & live setup checklist */
      #enableCard {
        width: 100%;
        max-width: 320px;
        text-align: center;
        margin-top: 14px;
      }
      #enableBtn {
        width: 100%;
        padding: 16px;
        border: none;
        border-radius: 12px;
        background: var(--red);
        color: #fff;
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(179, 33, 27, 0.3);
      }
      #enableBtn:disabled {
        opacity: 0.65;
      }

      .setup-steps {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 12px;
        font-size: 12px;
        opacity: 0.85;
      }
      .step-pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 9px;
        border-radius: 20px;
        background: rgba(16, 24, 32, 0.07);
        font-weight: 500;
      }
      body[data-level="critical"] .step-pill {
        background: rgba(255, 255, 255, 0.18);
      }
      .step-pill.done {
        color: var(--green);
        background: rgba(30, 122, 77, 0.12);
      }
      body[data-level="critical"] .step-pill.done {
        color: #fff;
      }

      .action-bar {
        display: flex;
        gap: 10px;
        margin-top: 16px;
        width: 100%;
        max-width: 320px;
        justify-content: center;
      }
      .ghost-btn {
        background: rgba(16, 24, 32, 0.08);
        color: currentColor;
        border: none;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
      }
      body[data-level="critical"] .ghost-btn {
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
      }
      .ghost-btn:active {
        opacity: 0.6;
      }

      .hint {
        font-size: 11.5px;
        opacity: 0.5;
        margin-top: 14px;
      }
      .note {
        font-size: 12px;
        opacity: 0.85;
        margin-top: 10px;
        max-width: 300px;
        text-align: center;
        line-height: 1.4;
      }
    </style>
  </head>
  <body data-level="setup">
    <div class="app">
      <div class="topbar">
        <button
          id="menuBtn"
          class="icon-btn"
          aria-label="Open menu"
          title="Menu"
        >
          ☰
        </button>
        <div class="brand">
          <span class="brand-mark">🚑</span>
          <h1>Ambulance Alert</h1>
        </div>
        <button
          id="muteBtn"
          class="icon-btn"
          aria-label="Mute alert sounds"
          title="Mute alert sounds"
        >
          🔊
        </button>

        <div class="menu-sheet" id="menuSheet">
          <button class="menu-item" id="menuPreviewBtn">
            <span>🔔</span>
            <span>Preview an Alert (Demo)</span>
          </button>
          <div class="menu-divider"></div>
          <a class="menu-item" href="driver.html" id="menuDriverLink">
            <span>🚨</span>
            <span>I'm an Ambulance Driver</span>
          </a>
          <a class="menu-item" href="dashboard.html" id="menuDashboardLink">
            <span>🗺️</span>
            <span>Live Map Dashboard</span>
          </a>
        </div>
      </div>

      <!-- Radar is always visible from the moment the page opens -->
      <div class="radar-stage" id="radarStage">
        <svg id="radarSvg" viewBox="0 0 300 300">
          <g id="sweepGroup">
            <path
              id="sweepWedge"
              d="M150,150 L150,10 A140,140 0 0 1 240,42 Z"
            ></path>
          </g>
          <circle class="zone-ring" cx="150" cy="150" r="140"></circle>
          <circle class="zone-ring" cx="150" cy="150" r="88.6"></circle>
          <circle class="zone-ring" cx="150" cy="150" r="44.3"></circle>
          <circle class="ripple r1" cx="150" cy="150" r="6"></circle>
          <circle class="ripple r2" cx="150" cy="150" r="6"></circle>
          <circle class="ripple r3" cx="150" cy="150" r="6"></circle>
          <g id="trailGroup"></g>
          <circle
            id="radarAmb"
            class="amb-marker"
            cx="150"
            cy="150"
            r="0"
          ></circle>
          <circle id="youDot" class="you-dot" cx="150" cy="150" r="7"></circle>
          <text class="radar-n" x="150" y="20" text-anchor="middle">N</text>
        </svg>
      </div>

      <div class="readout" id="readout">
        <div class="level-tag" id="levelLabel">Tap below to turn on alerts</div>
        <div class="distance-row" id="distanceRow" style="display: none">
          <span class="distance-num" id="distanceStat" data-val="0">0.0</span>
          <span class="distance-unit">km away</span>
        </div>
        <div class="level-desc" id="levelDescription">
          Get an instant warning when an emergency ambulance is heading your way.
        </div>
        <div class="dest-note" id="destinationNote"></div>
      </div>

      <div id="enableCard">
        <button id="enableBtn">🔔 Turn On Ambulance Alerts</button>
      </div>

      <div class="setup-steps" id="setupSteps">
        <span class="step-pill" id="stepNotif">○ Alerts</span>
        <span class="step-pill" id="stepLoc">○ GPS</span>
        <span class="step-pill" id="stepLive">○ Live Radar</span>
      </div>

      <div class="action-bar">
        <button class="ghost-btn" id="previewBtn">▶ Preview an Alert</button>
      </div>

      <div class="hint" id="tapHint">
        Tap the center dot anytime to test your connection.
      </div>
      <div class="note" id="connNote" style="display: none"></div>
      <div class="note" id="pushNote" style="display: none"></div>
    </div>

    <script>
      const API_BASE = "https://emergency-ambulance-alert.onrender.com";

      try {
        localStorage.setItem("ambulance_app_role", "citizen");
      } catch (e) {}

      function getDeviceId() {
        let deviceId = localStorage.getItem("ambulance_alert_device_id");
        if (!deviceId) {
          deviceId =
            "device_" +
            Math.random().toString(36).substring(2) +
            Date.now().toString(36);
          localStorage.setItem("ambulance_alert_device_id", deviceId);
        }
        return deviceId;
      }

      let USER_ID = null;
      let userLat = null;
      let userLng = null;
      let currentLevel = "setup";
      let trail = [];
      let previewTimers = [];
      let previewRunning = false;

      function setStepDone(id, label, done) {
        const el = document.getElementById(id);
        if (!el) return;
        el.classList.toggle("done", !!done);
        el.innerText = (done ? "✓ " : "○ ") + label;
      }

      // Menu drawer logic
      const menuBtn = document.getElementById("menuBtn");
      const menuSheet = document.getElementById("menuSheet");
      menuBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        menuSheet.classList.toggle("open");
      });
      document.addEventListener("click", (e) => {
        if (!e.target.closest("#menuSheet") && !e.target.closest("#menuBtn")) {
          menuSheet.classList.remove("open");
        }
      });
      document.getElementById("menuDriverLink").addEventListener("click", () => {
        try { localStorage.setItem("ambulance_app_role", "driver"); } catch (e) {}
      });
      document.getElementById("menuDashboardLink").addEventListener("click", () => {
        try { localStorage.setItem("ambulance_app_role", "dashboard"); } catch (e) {}
      });

      const MUTE_KEY = "ambulance_alert_muted";
      let muted = localStorage.getItem(MUTE_KEY) === "1";
      function updateMuteBtn() {
        document.getElementById("muteBtn").textContent = muted ? "🔇" : "🔊";
      }
      updateMuteBtn();
      document.getElementById("muteBtn").addEventListener("click", () => {
        muted = !muted;
        localStorage.setItem(MUTE_KEY, muted ? "1" : "0");
        updateMuteBtn();
      });

      const firebaseConfig = {
        apiKey: "AIzaSyCCDoW8qZ70Wc6qw6WWgmH10Wl1KvZZWTA",
        authDomain: "emergency-ambulance-alert.firebaseapp.com",
        projectId: "emergency-ambulance-alert",
        storageBucket: "emergency-ambulance-alert.firebasestorage.app",
        messagingSenderId: "487464125337",
        appId: "1:487464125337:web:d69f15c29f32921b1f4908",
      };

      const FB_BASE = "https://www.gstatic.com/firebasejs/10.12.0";
      let firebasePromise = null;
      function loadFirebase() {
        if (!firebasePromise) {
          firebasePromise = Promise.all([
            import(`${FB_BASE}/firebase-app.js`),
            import(`${FB_BASE}/firebase-messaging.js`),
          ]).then(([appModule, messagingModule]) => {
            const app = appModule.initializeApp(firebaseConfig);
            const messaging = messagingModule.getMessaging(app);
            messagingModule.onMessage(messaging, (payload) => {
              console.log("Message received in foreground:", payload);
              const level = payload.data?.level;
              if (level) playAlertSound(level);
            });
            return { messaging, getToken: messagingModule.getToken };
          });
          firebasePromise.catch(() => {
            firebasePromise = null;
          });
        }
        return firebasePromise;
      }
      if ("Notification" in window && Notification.permission !== "denied") {
        setTimeout(() => loadFirebase().catch(() => {}), 500);
      }

      let audioCtx = null;
      function ensureAudio() {
        if (!audioCtx) {
          try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          } catch (e) {}
        } else if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }
      }
      document.addEventListener("click", ensureAudio);
      document.addEventListener("touchstart", ensureAudio, { passive: true });

      function playTone(freq, duration, delay = 0) {
        if (muted || !audioCtx || audioCtx.state !== "running") return;
        setTimeout(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "sine";
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.22, audioCtx.currentTime + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration / 1000);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration / 1000 + 0.03);
        }, delay);
      }
      function playSiren(durationMs = 2200) {
        if (muted || !audioCtx || audioCtx.state !== "running") return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.connect(gain).connect(audioCtx.destination);

        const sweepSeconds = 0.7;
        const cycles = Math.ceil(durationMs / 1000 / sweepSeconds);
        for (let i = 0; i < cycles; i++) {
          const t0 = now + i * sweepSeconds;
          osc.frequency.setValueAtTime(600, t0);
          osc.frequency.linearRampToValueAtTime(1000, t0 + sweepSeconds / 2);
          osc.frequency.linearRampToValueAtTime(600, t0 + sweepSeconds);
        }

        const endTime = now + durationMs / 1000;
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.16, now + 0.05);
        gain.gain.setValueAtTime(0.16, endTime - 0.1);
        gain.gain.exponentialRampToValueAtTime(0.0001, endTime);

        osc.start(now);
        osc.stop(endTime + 0.05);
      }
      function playAlertSound(level) {
        if (level === "info") {
          playTone(660, 180);
        } else if (level === "high") {
          playTone(740, 140, 0);
          playTone(740, 140, 220);
        } else if (level === "critical") {
          playSiren();
        } else if (level === "clear") {
          playTone(520, 200);
        }
      }

      function setLevel(level, label, desc) {
        currentLevel = level;
        document.body.dataset.level = level;
        document.getElementById("levelLabel").innerText = label;
        document.getElementById("levelDescription").innerText = desc;
      }

      const ENABLED_KEY = "ambulance_alert_enabled";
      const USER_ID_KEY = "ambulance_alert_user_id";
      const TOKEN_SENT_KEY = "ambulance_alert_token_sent";
      const VAPID_KEY =
        "BPWOIImb1JqzHCIHgBIVb766CVEJ2Ka457SHGhDK7d41IKoftXgWQUMokd1fYa9ofEWxT2_kX6mDeUI2jNFJbFU";
      const LOCATION_SEND_EVERY_MS = 4000;
      const LOCATION_SEND_MIN_MOVE_KM = 0.015;
      let lastSentAt = 0;
      let lastSentLat = null;
      let lastSentLng = null;

      function showNote(id, text) {
        const el = document.getElementById(id);
        el.innerText = text || "";
        el.style.display = text ? "block" : "none";
      }

      async function registerDevice() {
        const resp = await fetch(`${API_BASE}/api/users/register-device`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ device_id: getDeviceId() }),
        });
        const data = await resp.json();
        if (!resp.ok || !data.user_id) {
          throw new Error(data.error || "Couldn't register this device");
        }
        USER_ID = data.user_id;
        localStorage.setItem(USER_ID_KEY, String(data.user_id));
        return data.user_id;
      }

      async function setupPush(registerPromise) {
        try {
          const registration = await navigator.serviceWorker.register(
            "firebase-messaging-sw.js",
          );
          await navigator.serviceWorker.ready;
          const { messaging, getToken } = await loadFirebase();
          const token = await getToken(messaging, {
            vapidKey: VAPID_KEY,
            serviceWorkerRegistration: registration,
          });
          const userId = await registerPromise;
          const sentKey = `${userId}:${token}`;
          if (localStorage.getItem(TOKEN_SENT_KEY) !== sentKey) {
            const resp = await fetch(`${API_BASE}/api/users/update-token`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ user_id: userId, fcm_token: token }),
            });
            if (!resp.ok) throw new Error("couldn't save the notification token");
            localStorage.setItem(TOKEN_SENT_KEY, sentKey);
          }
          showNote("pushNote", "");
        } catch (err) {
          console.error("Push setup failed:", err);
          showNote(
            "pushNote",
            "Push alerts aren't working on this device (" +
              err.message +
              "). The live radar still works while this page is open.",
          );
        }
      }

      function startLocationTracking(registerPromise) {
        if (!navigator.geolocation) {
          setLevel(
            "setup",
            "Location not supported",
            "This device can't share location, so we can't measure distance.",
          );
          return;
        }
        setLevel("setup", "Setting up…", "Getting your GPS location…");
        navigator.geolocation.watchPosition(
          async (pos) => {
            userLat = pos.coords.latitude;
            userLng = pos.coords.longitude;
            setStepDone("stepLoc", "GPS", true);
            try {
              await (USER_ID || registerPromise);
              if (currentLevel === "setup" && !previewRunning) showIdleState();

              const now = Date.now();
              const moved =
                lastSentLat === null
                  ? Infinity
                  : haversineDistance(lastSentLat, lastSentLng, userLat, userLng);
              if (now - lastSentAt < LOCATION_SEND_EVERY_MS && moved < LOCATION_SEND_MIN_MOVE_KM) {
                return;
              }
              lastSentAt = now;
              lastSentLat = userLat;
              lastSentLng = userLng;
              await fetch(`${API_BASE}/api/users/location`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  user_id: USER_ID,
                  latitude: userLat,
                  longitude: userLng,
                }),
              });
            } catch (err) {
              console.error("Location update failed:", err);
            }
          },
          (err) => {
            console.error("Location error:", err);
            setLevel(
              "setup",
              "Location is off",
              "Allow location permission in your browser settings, then tap Turn On again.",
            );
            const enableCard = document.getElementById("enableCard");
            const enableBtn = document.getElementById("enableBtn");
            enableCard.style.display = "block";
            enableBtn.disabled = false;
            enableBtn.innerText = "Retry Location Access";
          },
          { enableHighAccuracy: true, maximumAge: 5000 },
        );
      }

      async function initializeAlerts() {
        ensureAudio();
        const enableBtn = document.getElementById("enableBtn");
        enableBtn.disabled = true;
        enableBtn.innerText = "Setting up…";

        const permissionPromise =
          "Notification" in window
            ? Notification.requestPermission()
            : Promise.resolve("unsupported");

        try {
          setLevel("setup", "Setting up…", "Allow notifications when prompted.");
          const permission = await permissionPromise;
          if (permission === "unsupported") {
            setLevel(
              "setup",
              "Notifications not supported",
              "Open this link in Chrome or Safari instead of an in-app browser.",
            );
            enableBtn.disabled = false;
            enableBtn.innerText = "🔔 Turn On Ambulance Alerts";
            return;
          }
          if (permission !== "granted") {
            setLevel(
              "setup",
              "Notifications are blocked",
              "Tap the lock icon in your address bar → Permissions → Allow Notifications, then reload.",
            );
            enableBtn.disabled = false;
            enableBtn.innerText = "🔔 Turn On Ambulance Alerts";
            return;
          }
          setStepDone("stepNotif", "Alerts", true);
          localStorage.setItem(ENABLED_KEY, "1");
          document.getElementById("enableCard").style.display = "none";

          const savedId = Number(localStorage.getItem(USER_ID_KEY));
          if (savedId) USER_ID = savedId;

          const registerPromise = registerDevice();
          registerPromise.catch((err) => {
            console.error("Device registration failed:", err);
            if (!USER_ID) {
              setLevel(
                "setup",
                "Connecting to server…",
                "Server is waking up. Hang tight for a moment.",
              );
            }
          });
          setupPush(registerPromise);
          startLocationTracking(registerPromise);
        } catch (err) {
          setLevel("setup", "Setup failed", "Error: " + err.message);
          enableBtn.disabled = false;
          enableBtn.innerText = "🔔 Turn On Ambulance Alerts";
          console.error(err);
        }
      }

      document.getElementById("enableBtn").addEventListener("click", initializeAlerts);

      if (
        localStorage.getItem(ENABLED_KEY) === "1" &&
        "Notification" in window &&
        Notification.permission === "granted"
      ) {
        initializeAlerts();
      }

      // Interactive Preview / Demo Sequence (info -> high -> critical -> clear)
      function stopPreview() {
        previewTimers.forEach((t) => clearTimeout(t));
        previewTimers = [];
        previewRunning = false;
        document.getElementById("previewBtn").innerText = "▶ Preview an Alert";
        if (userLat !== null) {
          showIdleState();
        } else {
          setLevel(
            "setup",
            "Tap below to turn on alerts",
            "Get an instant warning when an emergency ambulance is heading your way.",
          );
          document.getElementById("distanceRow").style.display = "none";
          document.getElementById("destinationNote").innerText = "";
          document.getElementById("radarAmb").setAttribute("r", 0);
          trail = [];
          renderTrail();
        }
      }

      function runPreviewAlert() {
        ensureAudio();
        menuSheet.classList.remove("open");
        if (previewRunning) {
          stopPreview();
          return;
        }
        previewRunning = true;
        document.getElementById("previewBtn").innerText = "⏹ Stop Preview";
        trail = [];
        renderTrail();

        const steps = [
          { delay: 0, dist: 3.4, bearing: 42, level: "info", dest: "Government Medical College Yavatmal (Demo)" },
          { delay: 2200, dist: 1.3, bearing: 40, level: "high", dest: "Government Medical College Yavatmal (Demo)" },
          { delay: 4400, dist: 0.3, bearing: 38, level: "critical", dest: "Government Medical College Yavatmal (Demo)" },
          { delay: 7400, done: true },
        ];

        steps.forEach((s) => {
          const timer = setTimeout(() => {
            if (s.done) {
              playAlertSound("clear");
              stopPreview();
            } else {
              playAlertSound(s.level);
              updateLive(s.dist, s.dest, s.bearing);
            }
          }, s.delay);
          previewTimers.push(timer);
        });
      }

      document.getElementById("previewBtn").addEventListener("click", runPreviewAlert);
      document.getElementById("menuPreviewBtn").addEventListener("click", runPreviewAlert);

      let everConnected = false;
      let socket = { connected: false };

      function handleAmbulanceData(data) {
        if (previewRunning) stopPreview();
        if (userLat === null || userLng === null) return;
        const distanceKm = haversineDistance(
          userLat,
          userLng,
          data.latitude,
          data.longitude,
        );
        const bearing = bearingTo(
          userLat,
          userLng,
          data.latitude,
          data.longitude,
        );
        updateLive(distanceKm, data.destination, bearing);
      }

      // Immediately check active ambulances via fast HTTP so Live Radar is active
      // even before Socket.IO finishes downloading or handshaking on mobile data.
      async function pollActiveOnce() {
        try {
          const resp = await fetch(`${API_BASE}/api/dashboard/active`);
          if (resp.ok) {
            everConnected = true;
            setStepDone("stepLive", "Live Radar", true);
            showNote("connNote", "");
            const list = await resp.json();
            if (Array.isArray(list) && list.length > 0) {
              handleAmbulanceData(list[0]);
            }
          }
        } catch (e) {}
      }
      pollActiveOnce();
      setInterval(() => {
        if (!socket.connected) pollActiveOnce();
      }, 8000);

      // Load Socket.IO asynchronously from Cloudflare CDN (fast in India) without blocking the UI
      function initSocketAsync() {
        const s = document.createElement("script");
        s.src = "https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js";
        s.async = true;
        s.onload = () => {
          if (typeof io === "undefined") return;
          socket = io(API_BASE, { transports: ["websocket", "polling"] });
          socket.on("connect", () => {
            everConnected = true;
            setStepDone("stepLive", "Live Radar", true);
            showNote("connNote", "");
          });
          socket.on("disconnect", () => {
            showNote("connNote", "Reconnecting to live stream…");
          });
          socket.on("ambulance_update", handleAmbulanceData);
          socket.on("ambulance_ended", () => {
            if (!previewRunning) showIdleState();
          });
        };
        document.body.appendChild(s);
      }
      initSocketAsync();

      setTimeout(() => {
        if (!everConnected) {
          showNote(
            "connNote",
            "Waking up the alert server… this can take up to 30 seconds if idle.",
          );
        }
      }, 4500);

      function haversineDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = ((lat2 - lat1) * Math.PI) / 180;
        const dLon = ((lon2 - lon1) * Math.PI) / 180;
        const a =
          Math.sin(dLat / 2) ** 2 +
          Math.cos((lat1 * Math.PI) / 180) *
            Math.cos((lat2 * Math.PI) / 180) *
            Math.sin(dLon / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }
      function bearingTo(lat1, lon1, lat2, lon2) {
        const toRad = (d) => (d * Math.PI) / 180;
        const y = Math.sin(toRad(lon2 - lon1)) * Math.cos(toRad(lat2));
        const x =
          Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
          Math.sin(toRad(lat1)) *
            Math.cos(toRad(lat2)) *
            Math.cos(toRad(lon2 - lon1));
        return ((Math.atan2(y, x) * 180) / Math.PI + 360) % 360;
      }
      function radarScale(km) {
        return 140 * Math.sqrt(Math.min(km, 5) / 5);
      }

      function tweenNumber(el, to, duration = 450) {
        const from = parseFloat(el.dataset.val || to);
        const start = performance.now();
        el.dataset.val = to;
        function step(now) {
          const t = Math.min((now - start) / duration, 1);
          const eased = 1 - Math.pow(1 - t, 3);
          el.textContent = (from + (to - from) * eased).toFixed(1);
          if (t < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }

      function renderTrail() {
        const g = document.getElementById("trailGroup");
        g.innerHTML = "";
        trail.forEach((p, i) => {
          const c = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle",
          );
          c.setAttribute("cx", p.x);
          c.setAttribute("cy", p.y);
          c.setAttribute("r", 4 - i * 0.6);
          c.setAttribute("opacity", 0.4 - i * 0.1);
          c.setAttribute("class", "trail-dot");
          g.appendChild(c);
        });
      }

      function updateLive(distanceKm, destination, bearing) {
        if (distanceKm > 5) {
          showIdleState();
          return;
        }

        let level, label, desc;
        if (distanceKm <= 0.5) {
          level = "critical";
          label = "🔴 Give way immediately!";
          desc = "Emergency ambulance is right behind/near you.";
        } else if (distanceKm <= 2) {
          level = "high";
          label = "🚨 Prepare to give way";
          desc = "Ambulance is approaching your road.";
        } else {
          level = "info";
          label = "⚠️ Ambulance approaching";
          desc = "Stay alert — ambulance within 5 km.";
        }

        const wasCritical = currentLevel === "critical";
        setLevel(level, label, desc);
        document.getElementById("distanceRow").style.display = "flex";
        tweenNumber(document.getElementById("distanceStat"), distanceKm);

        const r = radarScale(distanceKm);
        const rad = (bearing * Math.PI) / 180;
        const mx = 150 + r * Math.sin(rad);
        const my = 150 - r * Math.cos(rad);

        const amb = document.getElementById("radarAmb");
        if (amb.getAttribute("r") === "0") {
          amb.setAttribute("r", 7);
        } else {
          trail.unshift({
            x: parseFloat(amb.getAttribute("cx")),
            y: parseFloat(amb.getAttribute("cy")),
          });
          trail = trail.slice(0, 4);
          renderTrail();
        }

        amb.setAttribute("cx", mx);
        amb.setAttribute("cy", my);

        if (level === "critical" && !wasCritical && "vibrate" in navigator) {
          try {
            navigator.vibrate([200, 100, 200]);
          } catch (e) {}
        }

        document.getElementById("destinationNote").innerText = destination
          ? `📍 Heading toward ${destination}`
          : "";
      }

      function showIdleState() {
        setLevel(
          "idle",
          "All clear — watching your area",
          "No active emergency ambulances within 5 km right now.",
        );
        document.getElementById("distanceRow").style.display = "none";
        document.getElementById("destinationNote").innerText = "";
        document.getElementById("radarAmb").setAttribute("r", 0);
        trail = [];
        renderTrail();
      }

      function spawnTapRipple() {
        const c = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "circle",
        );
        c.setAttribute("cx", 150);
        c.setAttribute("cy", 150);
        c.setAttribute("class", "tap-ripple");
        document.getElementById("radarSvg").appendChild(c);
        c.addEventListener("animationend", () => c.remove());
      }
      document.getElementById("youDot").addEventListener("click", () => {
        spawnTapRipple();
        const hint = document.getElementById("tapHint");
        hint.innerText = socket.connected
          ? "Connected to live alert server ✓"
          : "Reconnecting to alert server…";
      });
    </script>
  </body>
</html>
