<!DOCTYPE html>
<html>
<head>
    <title>Ambulance Alert</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#B3211B" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <script>
        // Returning visitors skip this screen and go straight to their app,
        // before anything is painted. The apps' "⇄" switch buttons come back
        // here with ?choose=1, which forgets the saved role and shows the
        // picker again.
        (function () {
            var ROLE_KEY = "ambulance_app_role";
            var URLS = { driver: "driver.html", citizen: "user.html", dashboard: "dashboard.html" };
            try {
                if (/[?&]choose=1/.test(location.search)) {
                    localStorage.removeItem(ROLE_KEY);
                    return;
                }
                var saved = localStorage.getItem(ROLE_KEY);
                if (saved && URLS[saved]) location.replace(URLS[saved]);
            } catch (e) {}
        })();
    </script>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #101820;
            color: #edefea;
        }
        .wrap {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 28px;
            text-align: center;
        }
        .brand-mark { font-size: 40px; margin-bottom: 6px; }
        h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
        .subtitle { font-size: 13px; opacity: 0.65; margin-bottom: 30px; max-width: 280px; }
        .role-btn {
            width: 100%;
            max-width: 320px;
            padding: 18px;
            margin-bottom: 14px;
            border: 1px solid #2b3648;
            border-radius: 14px;
            background: #16213e;
            color: #edefea;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 14px;
            text-align: left;
            text-decoration: none;
        }
        .role-btn:active { background: #1c2a4a; }
        .role-icon { font-size: 24px; }
        .role-text { display: flex; flex-direction: column; gap: 2px; }
        .role-sub { font-size: 12px; opacity: 0.6; font-weight: 400; }
        .hint { font-size: 12px; opacity: 0.5; margin-top: 10px; max-width: 280px; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="brand-mark">🚑</div>
        <h1>Ambulance Alert</h1>
        <div class="subtitle">Choose how you're using this app.</div>

        <a class="role-btn" href="driver.html" data-role="driver">
            <span class="role-icon">🚨</span>
            <span class="role-text">Driver<span class="role-sub">Broadcast your ambulance's live location</span></span>
        </a>
        <a class="role-btn" href="user.html" data-role="citizen">
            <span class="role-icon">📍</span>
            <span class="role-text">Citizen<span class="role-sub">Get alerted when an ambulance is near you</span></span>
        </a>
        <a class="role-btn" href="dashboard.html" data-role="dashboard">
            <span class="role-icon">🗺️</span>
            <span class="role-text">Dashboard<span class="role-sub">View all active ambulances on a map</span></span>
        </a>

        <div class="hint">Next time the app opens straight to your choice. Use the ⇄ button inside it to switch.</div>
    </div>

    <script>
        document.querySelectorAll(".role-btn").forEach(function (btn) {
            btn.addEventListener("click", function (e) {
                e.preventDefault();
                try { localStorage.setItem("ambulance_app_role", btn.dataset.role); } catch (err) {}
                // replace, not assign, so Back doesn't bounce you through here
                location.replace(btn.getAttribute("href"));
            });
        });
    </script>
</body>
</html>
