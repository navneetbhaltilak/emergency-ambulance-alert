<!DOCTYPE html>
<html>
<head>
    <title>Ambulance Alert Dashboard</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script>
        const API_BASE = "https://emergency-ambulance-alert.onrender.com";

        // Ask the server for the active ambulances RIGHT NOW, while the map
        // library is still downloading. Before, this request only started
        // after the map library and the socket library had both finished
        // loading, so the two waits were added together instead of overlapping.
        window.activeRequest = fetch(`${API_BASE}/api/dashboard/active`).then((r) => {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
        });
        window.activeRequest.catch(() => {}); // real handling happens below
    </script>
    <style>
        body { margin: 0; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; }
        #status {
            position: absolute; top: 10px; left: 50px; z-index: 1000;
            background: white; padding: 8px 12px; border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3); font-size: 14px;
            display: flex; align-items: center; gap: 12px;
        }
        #switchLink {
            font-size: 12px; color: #2a5bd7; text-decoration: none; white-space: nowrap;
        }
        #sidePanel {
            position: absolute; top: 60px; left: 50px; z-index: 1000;
            background: white; padding: 12px 16px; border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3); font-size: 13px;
            max-width: 250px; display: none;
        }
        #sidePanel h4 { margin: 0 0 8px 0; }
        #sidePanel p { margin: 4px 0; }
        .amb-div-icon { font-size: 24px; line-height: 28px; background: none; border: none; text-align: center; }
    </style>
</head>
<body>
    <div id="status">
        <span id="statusText">Connecting to the server…</span>
        <a id="switchLink" href="index.html?choose=1" title="Switch role">⇄ Roles</a>
    </div>
    <div id="sidePanel"></div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const statusText = document.getElementById('statusText');
        function setStatus(text) { statusText.innerText = text; }

        // Center map on your test area (Yavatmal coordinates)
        const map = L.map('map').setView([20.3897, 78.1274], 14);

        // One tile host instead of a/b/c subdomains: fewer connections to set up.
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Emoji marker instead of Leaflet's default image, which had to be
        // downloaded from a third-party site before any marker could appear.
        const ambulanceIcon = L.divIcon({
            html: '🚑', className: 'amb-div-icon', iconSize: [28, 28], iconAnchor: [14, 14]
        });

        let ambulanceMarkers = {};
        let ambulanceCircles = {};
        let loadedOnce = false;

        function updateStatusText() {
            const count = Object.keys(ambulanceMarkers).length;
            setStatus(count > 0 ? `${count} ambulance(s) active` : "No active ambulances");
        }

        function fetchActive() {
            return fetch(`${API_BASE}/api/dashboard/active`).then((r) => {
                if (!r.ok) throw new Error("HTTP " + r.status);
                return r.json();
            });
        }

        // Make the map match the server's list exactly: add/move what's
        // active, remove anything that isn't any more.
        function applyActiveList(list) {
            const ids = new Set(list.map((a) => a.ambulance_id));
            Object.keys(ambulanceMarkers).forEach((id) => {
                if (!ids.has(id)) removeAmbulance(id);
            });
            list.forEach(updateAmbulance);
            updateStatusText();
        }

        async function loadActive(attempt = 0) {
            try {
                const list = attempt === 0 ? await window.activeRequest : await fetchActive();
                applyActiveList(list);
                loadedOnce = true;
            } catch (err) {
                console.error("Loading ambulances failed:", err);
                if (attempt < 8) {
                    setStatus(attempt === 0 ? "Connecting to the server…" : "Server is waking up — still trying…");
                    setTimeout(() => loadActive(attempt + 1), Math.min(3000 * (attempt + 1), 15000));
                } else {
                    setStatus("Couldn't reach the server. Reload to try again.");
                }
            }
        }
        setTimeout(() => {
            if (!loadedOnce) setStatus("Server is waking up — this can take up to a minute…");
        }, 4000);
        loadActive();

        const socket = io(API_BASE);
        let everConnected = false;

        socket.on('connect', () => {
            console.log("Connected to live server");
            // After a dropped connection (phone slept, network switched) we
            // may have missed updates, so re-sync with the server's list.
            if (everConnected && loadedOnce) {
                fetchActive().then(applyActiveList).catch(() => {});
            }
            everConnected = true;
        });

        socket.on('ambulance_update', (data) => {
            updateAmbulance(data);
            updateStatusText();
        });

        socket.on('ambulance_ended', (data) => {
            console.log("Received ambulance_ended event:", data);
            removeAmbulance(data.ambulance_id);
            updateStatusText();
        });

        function updateAmbulance(amb) {
            const latlng = [amb.latitude, amb.longitude];

            if (ambulanceMarkers[amb.ambulance_id]) {
                ambulanceMarkers[amb.ambulance_id].setLatLng(latlng);
                ambulanceCircles[amb.ambulance_id].forEach(c => c.setLatLng(latlng));
            } else {
                const marker = L.marker(latlng, { icon: ambulanceIcon }).addTo(map)
                    .bindPopup(`${amb.ambulance_id}<br>Speed: ${amb.speed || 0} km/h`);

                const circleCritical = L.circle(latlng, {
                    radius: 500, color: 'darkred', fillColor: '#900', fillOpacity: 0.25
                }).addTo(map);
                const circleHigh = L.circle(latlng, {
                    radius: 2000, color: 'orange', fillColor: '#f80', fillOpacity: 0.12
                }).addTo(map);
                const circleInfo = L.circle(latlng, {
                    radius: 5000, color: 'gold', fillColor: '#ff0', fillOpacity: 0.05
                }).addTo(map);

                ambulanceMarkers[amb.ambulance_id] = marker;
                ambulanceCircles[amb.ambulance_id] = [circleCritical, circleHigh, circleInfo];
            }

            updateSidePanel(amb);
        }

        function removeAmbulance(ambulanceId) {
            if (ambulanceMarkers[ambulanceId]) {
                map.removeLayer(ambulanceMarkers[ambulanceId]);
                ambulanceCircles[ambulanceId].forEach(c => map.removeLayer(c));
                delete ambulanceMarkers[ambulanceId];
                delete ambulanceCircles[ambulanceId];
            }
            if (Object.keys(ambulanceMarkers).length === 0) {
                document.getElementById('sidePanel').style.display = "none";
            }
        }

        function updateSidePanel(amb) {
            const panel = document.getElementById('sidePanel');
            panel.style.display = "block";
            panel.innerHTML = `
                <h4>${amb.ambulance_id}</h4>
                <p><b>Speed:</b> ${amb.speed || 0} km/h</p>
                <p><b>Destination:</b> ${amb.destination || 'Not set'}</p>
                <p><b>Users alerted (this ping):</b> ${amb.alerted_count || 0}</p>
            `;
        }
    </script>
</body>
</html>
